<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Events | ISTE Admin</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Source+Sans+Pro:wght@300;400;600;700&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --primary: #003366;
            --secondary: #FF6B35;
            --bg-light: #F5F7FA;
            --text-primary: #1A1A2E;
            --text-secondary: #666;
            --sidebar-w: 250px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Source Sans Pro', sans-serif;
            background: var(--bg-light);
            color: var(--text-primary);
        }

        .sidebar {
            position: fixed;
            left: 0;
            top: 0;
            bottom: 0;
            width: var(--sidebar-w);
            background: var(--primary);
            color: white;
            padding: 20px 0;
            z-index: 100;
        }

        .sidebar-logo {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 0 20px 25px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .sidebar-logo .icon {
            width: 40px;
            height: 40px;
            background: var(--secondary);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 12px;
        }

        .sidebar-logo span {
            font-family: 'Playfair Display', serif;
            font-size: 18px;
            font-weight: 700;
        }

        .sidebar-nav {
            padding: 20px 0;
        }

        .sidebar-nav a {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 20px;
            color: rgba(255, 255, 255, 0.7);
            font-weight: 600;
            font-size: 14px;
            text-decoration: none;
            transition: all 0.3s;
        }

        .sidebar-nav a:hover,
        .sidebar-nav a.active {
            color: white;
            background: rgba(255, 255, 255, 0.1);
        }

        .sidebar-nav a.active {
            border-left: 3px solid var(--secondary);
        }

        .sidebar-nav a span {
            font-size: 18px;
        }

        .main {
            margin-left: var(--sidebar-w);
            padding: 30px;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .top-bar h1 {
            font-family: 'Playfair Display', serif;
            font-size: 28px;
            color: var(--primary);
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            font-family: inherit;
            font-size: 14px;
            text-decoration: none;
            display: inline-block;
        }

        .btn-primary {
            background: var(--secondary);
            color: white;
        }

        .btn-primary:hover {
            background: #e55a2b;
        }

        .btn-danger {
            background: #dc3545;
            color: white;
        }

        .btn-danger:hover {
            background: #c82333;
        }

        .btn-sm {
            padding: 6px 12px;
            font-size: 12px;
        }

        .logout-btn {
            padding: 8px 20px;
            background: var(--secondary);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            font-family: inherit;
            font-size: 14px;
        }

        table {
            width: 100%;
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            border-collapse: collapse;
        }

        th {
            background: var(--primary);
            color: white;
            padding: 14px 16px;
            text-align: left;
            font-size: 13px;
            text-transform: uppercase;
        }

        td {
            padding: 12px 16px;
            border-bottom: 1px solid #eee;
            font-size: 14px;
        }

        tr:hover {
            background: #f8f9fa;
        }

        .cover-thumb {
            width: 60px;
            height: 40px;
            object-fit: cover;
            border-radius: 6px;
            background: #eee;
        }

        .badge {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
        }

        .badge-yes {
            background: #d4edda;
            color: #155724;
        }

        .badge-no {
            background: #f8d7da;
            color: #721c24;
        }

        .actions {
            display: flex;
            gap: 6px;
        }

        .empty-msg {
            text-align: center;
            padding: 40px;
            color: var(--text-secondary);
        }

        @media (max-width: 768px) {
            .sidebar {
                width: 100%;
                height: auto;
                position: relative;
            }

            .sidebar-nav {
                display: flex;
                overflow-x: auto;
                padding: 10px;
            }

            .sidebar-nav a {
                white-space: nowrap;
                padding: 8px 15px;
            }

            .main {
                margin-left: 0;
            }

            table {
                font-size: 12px;
            }
        }
    </style>
</head>

<body>
    <div class="sidebar">
        <div class="sidebar-logo">
            <div class="icon">ISTE</div><span>Admin Panel</span>
        </div>
        <nav class="sidebar-nav">
            <a href="/dashboard"><span>📊</span> Dashboard</a>
            <a href="/events" class="active"><span>📅</span> Events</a>
            <a href="/notices"><span>📋</span> Notices</a>
        </nav>
    </div>
    <div class="main">
        <div class="top-bar">
            <h1>Manage Events</h1>
            <div style="display:flex;gap:10px;align-items:center;">
                <a href="/events/new" class="btn btn-primary">+ Add Event</a>
                <button class="logout-btn" onclick="logout()">Logout</button>
            </div>
        </div>
        <table>
            <thead>
                <tr>
                    <th>Cover</th>
                    <th>Title</th>
                    <th>Date</th>
                    <th>Location</th>
                    <th>Category</th>
                    <th>Upcoming</th>
                    <th>Images</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="eventsBody">
                <tr>
                    <td colspan="8" class="empty-msg">Loading...</td>
                </tr>
            </tbody>
        </table>
    </div>
    <script>
        async function loadEvents() {
            try {
                const res = await fetch('/api/events');
                if (res.status === 401) { window.location.href = '/login'; return; }
                const events = await res.json();
                const tbody = document.getElementById('eventsBody');
                if (events.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="8" class="empty-msg">No events yet. Click "+ Add Event" to create one.</td></tr>';
                    return;
                }
                tbody.innerHTML = events.map(ev => `
                    <tr>
                        <td>${ev.coverImage ? `<img src="${ev.coverImage}" class="cover-thumb" alt="">` : '<div class="cover-thumb" style="display:flex;align-items:center;justify-content:center;font-size:20px;">📅</div>'}</td>
                        <td><strong>${ev.title}</strong></td>
                        <td>${new Date(ev.eventDate).toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' })}</td>
                        <td>${ev.location}</td>
                        <td>${ev.category || 'Event'}</td>
                        <td><span class="badge ${ev.isUpcoming ? 'badge-yes' : 'badge-no'}">${ev.isUpcoming ? 'Yes' : 'No'}</span></td>
                        <td>${ev.images ? ev.images.length : 0}</td>
                        <td class="actions">
                            <a href="/events/edit/${ev._id}" class="btn btn-primary btn-sm">Edit</a>
                            <button class="btn btn-danger btn-sm" onclick="deleteEvent('${ev._id}')">Delete</button>
                        </td>
                    </tr>
                `).join('');
            } catch (err) { console.error('Error:', err); }
        }
        async function deleteEvent(id) {
            if (!confirm('Delete this event? This cannot be undone.')) return;
            try {
                const res = await fetch('/api/events/' + id, { method: 'DELETE' });
                if (res.ok) loadEvents();
                else alert('Delete failed');
            } catch (err) { alert('Error deleting event'); }
        }
        async function logout() { await fetch('/auth/logout', { method: 'POST' }); window.location.href = '/login'; }
        loadEvents();
    </script>
</body>

</html>
