<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | ISTE Admin</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Source+Sans+Pro:wght@300;400;600;700&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --primary: #003366;
            --secondary: #FF6B35;
            --bg-light: #F5F7FA;
            --text-primary: #1A1A2E;
            --text-secondary: #666;
            --sidebar-w: 250px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Source Sans Pro', sans-serif;
            background: var(--bg-light);
            color: var(--text-primary);
        }

        .sidebar {
            position: fixed;
            left: 0;
            top: 0;
            bottom: 0;
            width: var(--sidebar-w);
            background: var(--primary);
            color: white;
            padding: 20px 0;
            z-index: 100;
        }

        .sidebar-logo {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 0 20px 25px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .sidebar-logo .icon {
            width: 40px;
            height: 40px;
            background: var(--secondary);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 12px;
        }

        .sidebar-logo span {
            font-family: 'Playfair Display', serif;
            font-size: 18px;
            font-weight: 700;
        }

        .sidebar-nav {
            padding: 20px 0;
        }

        .sidebar-nav a {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 20px;
            color: rgba(255, 255, 255, 0.7);
            font-weight: 600;
            font-size: 14px;
            text-decoration: none;
            transition: all 0.3s;
        }

        .sidebar-nav a:hover,
        .sidebar-nav a.active {
            color: white;
            background: rgba(255, 255, 255, 0.1);
        }

        .sidebar-nav a.active {
            border-left: 3px solid var(--secondary);
        }

        .sidebar-nav a span {
            font-size: 18px;
        }

        .main {
            margin-left: var(--sidebar-w);
            padding: 30px;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .top-bar h1 {
            font-family: 'Playfair Display', serif;
            font-size: 28px;
            color: var(--primary);
        }

        .logout-btn {
            padding: 8px 20px;
            background: var(--secondary);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            font-family: inherit;
            font-size: 14px;
        }

        .logout-btn:hover {
            background: #e55a2b;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
        }

        .stat-card h3 {
            font-size: 36px;
            color: var(--secondary);
            font-family: 'Playfair Display', serif;
        }

        .stat-card p {
            color: var(--text-secondary);
            font-size: 14px;
            margin-top: 5px;
        }

        .quick-actions {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }

        .action-card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            cursor: pointer;
            transition: all 0.3s;
            text-decoration: none;
            color: var(--text-primary);
        }

        .action-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
        }

        .action-card span {
            font-size: 30px;
            display: block;
            margin-bottom: 10px;
        }

        .action-card h4 {
            font-size: 15px;
            color: var(--primary);
        }

        @media (max-width: 768px) {
            .sidebar {
                width: 100%;
                height: auto;
                position: relative;
            }

            .sidebar-nav {
                display: flex;
                overflow-x: auto;
                padding: 10px;
            }

            .sidebar-nav a {
                white-space: nowrap;
                padding: 8px 15px;
            }

            .main {
                margin-left: 0;
            }
        }
    </style>
</head>

<body>
    <div class="sidebar">
        <div class="sidebar-logo">
            <div class="icon">ISTE</div>
            <span>Admin Panel</span>
        </div>
        <nav class="sidebar-nav">
            <a href="/dashboard" class="active"><span>📊</span> Dashboard</a>
            <a href="/events"><span>📅</span> Events</a>
            <a href="/notices"><span>📋</span> Notices</a>
        </nav>
    </div>
    <div class="main">
        <div class="top-bar">
            <h1>Dashboard</h1>
            <button class="logout-btn" onclick="logout()">Logout</button>
        </div>
        <div class="stats-grid">
            <div class="stat-card">
                <h3 id="eventCount">-</h3>
                <p>Total Events</p>
            </div>
            <div class="stat-card">
                <h3 id="noticeCount">-</h3>
                <p>Total Notices</p>
            </div>
            <div class="stat-card">
                <h3 id="upcomingCount">-</h3>
                <p>Upcoming Events</p>
            </div>
        </div>
        <h2 style="font-family:'Playfair Display',serif;color:var(--primary);margin-bottom:15px;">Quick Actions</h2>
        <div class="quick-actions">
            <a href="/events/new" class="action-card"><span>➕</span>
                <h4>Add New Event</h4>
            </a>
            <a href="/notices/new" class="action-card"><span>📝</span>
                <h4>Add New Notice</h4>
            </a>
            <a href="/events" class="action-card"><span>📅</span>
                <h4>Manage Events</h4>
            </a>
            <a href="/notices" class="action-card"><span>📋</span>
                <h4>Manage Notices</h4>
            </a>
        </div>
    </div>
    <script>
        async function loadStats() {
            try {
                const [eventsRes, noticesRes] = await Promise.all([
                    fetch('/api/events'),
                    fetch('/api/notices')
                ]);
                if (eventsRes.status === 401) { window.location.href = '/login'; return; }
                const events = await eventsRes.json();
                const notices = await noticesRes.json();
                document.getElementById('eventCount').textContent = events.length;
                document.getElementById('noticeCount').textContent = notices.length;
                document.getElementById('upcomingCount').textContent = events.filter(e => e.isUpcoming).length;
            } catch (err) { console.error('Error loading stats:', err); }
        }
        async function logout() {
            await fetch('/auth/logout', { method: 'POST' });
            window.location.href = '/login';
        }
        loadStats();
    </script>
</body>

</html>
