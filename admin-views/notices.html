<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Notices | ISTE Admin</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Source+Sans+Pro:wght@300;400;600;700&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --primary: #003366;
            --secondary: #FF6B35;
            --bg-light: #F5F7FA;
            --text-primary: #1A1A2E;
            --text-secondary: #666;
            --sidebar-w: 250px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Source Sans Pro', sans-serif;
            background: var(--bg-light);
            color: var(--text-primary);
        }

        .sidebar {
            position: fixed;
            left: 0;
            top: 0;
            bottom: 0;
            width: var(--sidebar-w);
            background: var(--primary);
            color: white;
            padding: 20px 0;
            z-index: 100;
        }

        .sidebar-logo {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 0 20px 25px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .sidebar-logo .icon {
            width: 40px;
            height: 40px;
            background: var(--secondary);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 12px;
        }

        .sidebar-logo span {
            font-family: 'Playfair Display', serif;
            font-size: 18px;
            font-weight: 700;
        }

        .sidebar-nav {
            padding: 20px 0;
        }

        .sidebar-nav a {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 20px;
            color: rgba(255, 255, 255, 0.7);
            font-weight: 600;
            font-size: 14px;
            text-decoration: none;
            transition: all 0.3s;
        }

        .sidebar-nav a:hover,
        .sidebar-nav a.active {
            color: white;
            background: rgba(255, 255, 255, 0.1);
        }

        .sidebar-nav a.active {
            border-left: 3px solid var(--secondary);
        }

        .sidebar-nav a span {
            font-size: 18px;
        }

        .main {
            margin-left: var(--sidebar-w);
            padding: 30px;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .top-bar h1 {
            font-family: 'Playfair Display', serif;
            font-size: 28px;
            color: var(--primary);
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            font-family: inherit;
            font-size: 14px;
            text-decoration: none;
            display: inline-block;
        }

        .btn-primary {
            background: var(--secondary);
            color: white;
        }

        .btn-danger {
            background: #dc3545;
            color: white;
        }

        .btn-sm {
            padding: 6px 12px;
            font-size: 12px;
        }

        .logout-btn {
            padding: 8px 20px;
            background: var(--secondary);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            font-family: inherit;
            font-size: 14px;
        }

        table {
            width: 100%;
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            border-collapse: collapse;
        }

        th {
            background: var(--primary);
            color: white;
            padding: 14px 16px;
            text-align: left;
            font-size: 13px;
            text-transform: uppercase;
        }

        td {
            padding: 12px 16px;
            border-bottom: 1px solid #eee;
            font-size: 14px;
        }

        tr:hover {
            background: #f8f9fa;
        }

        .actions {
            display: flex;
            gap: 6px;
        }

        .badge {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
            background: #d4edda;
            color: #155724;
        }

        .empty-msg {
            text-align: center;
            padding: 40px;
            color: var(--text-secondary);
        }

        @media (max-width: 768px) {
            .sidebar {
                width: 100%;
                height: auto;
                position: relative;
            }

            .sidebar-nav {
                display: flex;
                overflow-x: auto;
                padding: 10px;
            }

            .sidebar-nav a {
                white-space: nowrap;
                padding: 8px 15px;
            }

            .main {
                margin-left: 0;
            }
        }
    </style>
</head>

<body>
    <div class="sidebar">
        <div class="sidebar-logo">
            <div class="icon">ISTE</div><span>Admin Panel</span>
        </div>
        <nav class="sidebar-nav">
            <a href="/dashboard"><span>📊</span> Dashboard</a>
            <a href="/events"><span>📅</span> Events</a>
            <a href="/notices" class="active"><span>📋</span> Notices</a>
        </nav>
    </div>
    <div class="main">
        <div class="top-bar">
            <h1>Manage Notices</h1>
            <div style="display:flex;gap:10px;align-items:center;">
                <a href="/notices/new" class="btn btn-primary">+ Add Notice</a>
                <button class="logout-btn" onclick="logout()">Logout</button>
            </div>
        </div>
        <table>
            <thead>
                <tr>
                    <th>Title</th>
                    <th>Published</th>
                    <th>PDF</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="noticesBody">
                <tr>
                    <td colspan="4" class="empty-msg">Loading...</td>
                </tr>
            </tbody>
        </table>
    </div>
    <script>
        async function loadNotices() {
            try {
                const res = await fetch('/api/notices');
                if (res.status === 401) { window.location.href = '/login'; return; }
                const notices = await res.json();
                const tbody = document.getElementById('noticesBody');
                if (notices.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="4" class="empty-msg">No notices yet. Click "+ Add Notice" to create one.</td></tr>';
                    return;
                }
                tbody.innerHTML = notices.map(n => `
                    <tr>
                        <td><strong>${n.title}</strong><br><small style="color:#666;">${n.description.substring(0, 80)}${n.description.length > 80 ? '...' : ''}</small></td>
                        <td>${new Date(n.publishDate).toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' })}</td>
                        <td>${n.pdfPath ? '<span class="badge">📄 PDF</span>' : '-'}</td>
                        <td class="actions">
                            <a href="/notices/edit/${n._id}" class="btn btn-primary btn-sm">Edit</a>
                            <button class="btn btn-danger btn-sm" onclick="deleteNotice('${n._id}')">Delete</button>
                        </td>
                    </tr>
                `).join('');
            } catch (err) { console.error('Error:', err); }
        }
        async function deleteNotice(id) {
            if (!confirm('Delete this notice?')) return;
            try {
                const res = await fetch('/api/notices/' + id, { method: 'DELETE' });
                if (res.ok) loadNotices();
                else alert('Delete failed');
            } catch (err) { alert('Error deleting notice'); }
        }
        async function logout() { await fetch('/auth/logout', { method: 'POST' }); window.location.href = '/login'; }
        loadNotices();
    </script>
</body>

</html>
